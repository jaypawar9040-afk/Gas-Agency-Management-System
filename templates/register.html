{% extends "base.html" %}
{% block title %}Register - Smart Gas Agency{% endblock %}
{% block content %}
  <h2>Register</h2>
  <form id="registerForm" method="POST" action="{{ url_for('register') }}" novalidate>
    <label for="reg_name">Name</label>
    <input type="text" id="reg_name" name="name" required>

    <label for="address">Address</label>
    <input type="text" id="reg_address" name="address">

    <label for="mobile">Mobile (10 digits)</label>
    <input type="text" id="reg_mobile" name="mobile" required>

    <label for="pincode">Pincode</label>
    <input type="text" id="reg_pincode" name="pincode">

    <label for="email">Email</label>
    <input type="email" id="reg_email" name="email" required>

    <label for="reg_password">Password (exactly 10 chars, include lower, upper & special)</label>
    <input type="password" id="reg_password" name="password" required>

    <label for="date">Registration Date:</label>
    <input type="date" id="date" name="date" required>


    <button type="submit">Register</button>
  </form>

  <p>Already registered? <a href="{{ url_for('login') }}">Login here</a>.</p>

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', function(e){
  if(!validateRegister()){
    e.preventDefault();
  }
});
</script>
{% endblock %}
{% endblock %}
